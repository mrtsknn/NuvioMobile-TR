name: Build TR IPA
run-name: ${{ inputs.release_tag != '' && format('Build TR IPA - {0}', inputs.release_tag) || 'Build TR IPA' }}

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Release (optimized) or Debug (fast check)
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release
      release_tag:
        description: Optional tag (e.g. 0.6.5-tr.1) - publishes a pre-release with the IPA attached
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: tr-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned ${{ inputs.configuration }} IPA
    # Hosted runner; the upstream "xcode-27" label is private to luqmanfadlli/NuvioMobile-Enhanced.
    runs-on: macos-26
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      KOTLIN_DAEMON_JVMARGS: -Xmx1024M
      NUVIO_GRADLE_JVMARGS: -Xmx2048M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M -XX:+UseG1GC
      NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx9216M -XX:+UseG1GC
      RELEASE_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
      CONTRIBUTIONS_URL: https://api.github.com/repos/${{ github.repository }}/contributors?per_page=100
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          xcode_app="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          echo "DEVELOPER_DIR=${xcode_app}/Contents/Developer" >> "${GITHUB_ENV}"
          echo "Using ${xcode_app}"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure runtime properties
        run: |
          if [[ -n "${RELEASE_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
            sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          fi
          printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL}" >> local.properties

      - name: Constrain Gradle memory for the hosted runner
        run: |
          gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
          mkdir -p "${gradle_user_home}"
          {
            echo "org.gradle.jvmargs=${NUVIO_GRADLE_JVMARGS}"
            echo "kotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVMARGS}"
            echo "kotlin.native.jvmArgs=${NUVIO_KOTLIN_NATIVE_JVMARGS}"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=1"
            echo "kotlin.native.disableCompilerDaemon=true"
          } >> "${gradle_user_home}/gradle.properties"

      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh

      - name: Build unsigned IPA
        run: ./scripts/build-ios-ipa.sh

      - name: Rename and summarize IPA
        id: ipa
        run: |
          configuration_slug="$(printf '%s' "${IOS_CONFIGURATION}" | tr '[:upper:]' '[:lower:]')"
          source_ipa="$(find build/ios-ipa -maxdepth 1 -type f -name "*-${configuration_slug}.ipa" -print -quit)"
          if [[ -z "${source_ipa}" ]]; then
            echo "No IPA was produced." >&2
            exit 1
          fi
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION[[:space:]]*=[[:space:]]*([^[:space:]#]+).*$/\1/p' iosApp/Configuration/Version.xcconfig | head -n 1)"
          ipa_path="build/ios-ipa/nuvio-tr-${RELEASE_TAG:-${version}}-${configuration_slug}.ipa"
          mv "${source_ipa}" "${ipa_path}"
          echo "path=${ipa_path}" >> "${GITHUB_OUTPUT}"
          {
            echo "## TR IPA"
            echo
            echo "- File: $(basename "${ipa_path}")"
            echo "- Size: $(du -h "${ipa_path}" | cut -f1)"
            echo "- SHA-256: $(shasum -a 256 "${ipa_path}" | awk '{print $1}')"
            echo "- Configuration: ${IOS_CONFIGURATION}"
            echo "- Signing: unsigned (sideload with AltStore / SideStore / Sideloadly)"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-tr-${{ inputs.configuration }}-ipa-${{ github.sha }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish pre-release
        if: inputs.release_tag != ''
        run: |
          gh release create "${RELEASE_TAG}" "${{ steps.ipa.outputs.path }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Nuvio TR ${RELEASE_TAG}" \
            --prerelease \
            --notes "Unsigned iOS build of Nuvio Enhanced (TR fork). Install with AltStore, SideStore or Sideloadly."
